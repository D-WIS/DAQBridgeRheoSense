name: Build and Push RheoSense Docker images

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Server
            dockerfile: DWIS.DAQBridge.RheoSense.Server/Dockerfile
            image: digiwells/dwisdaqbridgerheosenseserver
          - name: OPC-UA Source
            dockerfile: DWIS.DAQBridge.RheoSense.OPCUASource/Dockerfile
            image: digiwells/dwisdaqbridgerheosenseopcuasource

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Wait for public OPC Foundation client package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c "import xml.etree.ElementTree as E; r=E.parse('DWIS.DAQBridge.RheoSense.Model/DWIS.DAQBridge.RheoSense.Model.csproj'); print(next(p.attrib['Version'] for p in r.findall('.//PackageReference') if p.attrib['Include']=='DWIS.Client.ReferenceImplementation.OPCFoundation'))")"
          PACKAGE=dwis.client.referenceimplementation.opcfoundation
          URL="https://api.nuget.org/v3-flatcontainer/$PACKAGE/$VERSION/$PACKAGE.$VERSION.nupkg"
          for ATTEMPT in $(seq 1 40); do
            if curl --fail --silent --location --head "$URL" > /dev/null; then
              echo "OPC Foundation client $VERSION is publicly available."
              exit 0
            fi
            echo "Waiting for NuGet indexing: $VERSION (attempt $ATTEMPT/40)."
            sleep 15
          done
          echo "OPC Foundation client $VERSION did not become publicly available within 10 minutes."
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=stable
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

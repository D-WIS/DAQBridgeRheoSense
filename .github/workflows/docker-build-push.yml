name: Build and Push RheoSense Docker images

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Server
            dockerfile: DWIS.DAQBridge.RheoSense.Server/Dockerfile
            image: digiwells/dwisdaqbridgerheosenseserver
          - name: OPC-UA Source
            dockerfile: DWIS.DAQBridge.RheoSense.OPCUASource/Dockerfile
            image: digiwells/dwisdaqbridgerheosenseopcuasource
          - name: WebApp
            dockerfile: DWIS.DAQBridge.RheoSense.WebApp/Dockerfile
            image: digiwells/dwisdaqbridgerheosensewebapp

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=stable
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
